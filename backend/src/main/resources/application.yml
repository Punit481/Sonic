spring:
  application:
    name: sonic-backend
  config:
    # Local secrets; see .env.example.
    import: optional:file:.env[.properties]
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/sonic}
    username: ${DATABASE_USERNAME:sonic}
    password: ${DATABASE_PASSWORD:sonic}
  flyway:
    locations: classpath:db/migration
  mvc:
    problemdetails:
      enabled: true
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  security:
    oauth2:
      resourceserver:
        jwt:
          # Your Clerk Frontend API URL, e.g. https://your-app.clerk.accounts.dev
          issuer-uri: ${CLERK_ISSUER}
  ai:
    # Groq's free tier, through its OpenAI-compatible API: gpt-oss for text, Whisper for speech.
    openai:
      # Without a key the app still runs; AI requests fail with a clear error.
      api-key: ${GROQ_API_KEY:missing}
      base-url: https://api.groq.com/openai/v1
      max-retries: 2
      timeout: 60s
      chat:
        model: ${GROQ_CHAT_MODEL:openai/gpt-oss-120b}
        temperature: 0.2
        # A reasoning model: low effort keeps replies fast; the task is extraction, not puzzles.
        reasoning-effort: low
        # JSON mode: the reply is always valid JSON, which Spring AI maps onto the Java records.
        response-format:
          type: JSON_OBJECT
      audio:
        transcription:
          model: ${GROQ_TRANSCRIPTION_MODEL:whisper-large-v3-turbo}
          language: en
          prompt: "Gym workout log: bench press, squats, deadlifts, sets, reps, kilos, pounds, km, minutes."
    model:
      # Only chat and speech-to-text are used.
      embedding: none
      image: none
      moderation: none
      audio:
        speech: none
  docker:
    compose:
      lifecycle-management: start-only

server:
  port: ${PORT:8080}
  shutdown: graceful

sonic:
  cors:
    allowed-origins: ${SONIC_ALLOWED_ORIGINS:http://localhost:5173}
  clerk:
    # Only used when the session token has no email claim (see README).
    secret-key: ${CLERK_SECRET_KEY:}
  insights:
    cooldown: 24h
    min-sessions: 3
    lookback: 90d
  rate-limit:
    ai-requests-per-hour: ${SONIC_AI_REQUESTS_PER_HOUR:30}

management:
  endpoints:
    web:
      exposure:
        include: health,info

springdoc:
  swagger-ui:
    path: /swagger-ui

logging:
  structured:
    format:
      console: ${LOG_FORMAT:}
